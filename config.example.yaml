auth:
  media-user-token: "your-media-user-token" # If you need to obtain lyrics and aac-lc, need to change it
  authorization-token: "your-authorization-token" # You don't need to change it; it can automatically obtain token
  storefront: "enter your account storefront"
  # storefront will be used only in searching.
  # storefront is the 2-letter country code that are available in the urls (jp, ca, us etc.).
  # if your account is from Japan, you must use jp.
  # if the storefront is different from your account, you will see a "failed to get lyrics" error in most of the songs.
  language: "" # supportedLanguage by each storefront --> https://gist.github.com/itouakirai/c8ba9df9dc65bd300094103b058731d0

download:
  codec:
    aac-type: aac-lc # aac-lc aac aac-binaural aac-downmix
    alac-max: 192000 # 192000 96000 48000 44100
    atmos-max: 2768 # 2768 2448
  threads: 1
  max-memory: 256 # MB
  m3u8:
    decrypt-port: "127.0.0.1:10020"
    get-port: "127.0.0.1:20020"
    get-from-device: true
    # set 'all' to retrieve all m3u8, and set 'hires' to only detect hires m3u8.
    mode: hires # all hires
  playlist:
    # if set true, for playlist, will use songinfo for meta #albumname track disk
    use-songinfo-for-playlist: false
    # if set true, will download album cover for playlist
    dl-albumcover-for-playlist: false
  mv:
    audio-type: atmos # atmos ac3 aac
    max: 2160

lyrics:
  enable: true
  type: syllable # lyrics or syllable
  format: ttml # lrc or ttml
  embed: true
  save-file: false

artwork:
  embed-cover: true
  size: 5000x5000
  format: jpg # jpg png or original
  save-artist-cover: false
  save-animated: false # If enabled, requires ffmpeg
  emby-animated: false # If enabled, requires ffmpeg

paths:
  alac: "AM-DL downloads"
  atmos: "AM-DL-Atmos downloads"
  aac: "AM-DL-AAC downloads"

naming:
  limit-max: 200
  # {AlbumId} {AlbumName} {ArtistName} {ReleaseDate} {ReleaseYear} {UPC} {Copyright} {Quality} {Codec} {Tag} {RecordLabel}
  # example: {ReleaseYear} - {ArtistName} - {AlbumName}({AlbumId})({UPC})({Copyright}){Codec}
  album: "{AlbumName}"
  # {PlaylistId} {PlaylistName} {ArtistName} {Quality} {Codec} {Tag}
  playlist: "{PlaylistName}"
  # {SongId} {SongNumer} {SongName} {DiscNumber} {TrackNumber} {Quality} {Codec} {Tag}
  # example: Disk {DiscNumber} - Track {TrackNumber} {SongName} [{Quality}]{{Tag}}"
  song: "{SongNumer}. {SongName}"
  # {ArtistId} {ArtistName}/{UrlArtistName}
  # if artist folder format set "", will not make artist folder
  artist: "{UrlArtistName}"
  # if set "" will not add tag
  explicit-choice: "[E]"
  clean-choice: "[C]"
  apple-master-choice: "[M]"

convert:
  enable: false # Enable post-download conversion (requires ffmpeg)
  format: "flac" # flac | mp3 | opus | wav | copy (no re-encode)
  keep-original: false # Keep original file after successful conversion
  skip-if-source-matches: true # If already in target format, skip
  ffmpeg: "ffmpeg" # Override if ffmpeg is not in PATH
  extra-args: "" # Additional raw args appended (advanced)
  # Conversion warnings and behavior
  warn-lossy-to-lossless: true # If true, print a warning when converting a detected lossy source to a lossless container
  skip-lossy-to-lossless: true # If true, skip converting detected lossy sources to lossless target formats (flac/wav)
